baseURL = 'https://example.pages.dev/'
locale = 'zh-cn'
title = '我的博客'
enableRobotsTXT = true

[params]
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true

[params.homeInfoParams]
Title = 'Hi, 我是某某 👋'
Content = '这里是我的个人博客,记录技术与生活。'

[params.socialIcons]
# name: url

[menus]
[[menus.main]]
name = '归档'
pageRef = '/archives'
weight = 10
[[menus.main]]
name = '搜索'
pageRef = '/search'
weight = 20

[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai'
noClasses = false

[module]
[[module.imports]]
path = 'github.com/adityatelange/hugo-PaperMod'
